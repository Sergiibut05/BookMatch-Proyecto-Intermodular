<div class="flex flex-col gap-4">
  <div class="flex justify-between items-end px-1">
    <h2 class="text-2xl font-bold" style="color: #45332D;">
      {{ categoryTitle }}
    </h2>
    
    @if (isNewArrivals || categoryId || categoryUrl) {
      <button 
        (click)="onSeeMore()" 
        class="text-sm font-semibold hover:underline flex items-center gap-1 transition-colors"
        style="color: #E0A15E;">
        {{ 'BOOK_DETAILS.SEE_MORE' | translate }} 
      </button>
    }
  </div>


  <div class="relative group">
    
    <button 
      (click)="prev()" 
      class="absolute left-0 top-1/2 -translate-y-1/2 -ml-4 z-10 w-10 h-10 rounded-full bg-white shadow-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 hover:bg-gray-50 focus:outline-none"
      style="color: #45332D;"
      aria-label="Anterior">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <div 
      #carousel
      class="flex gap-4 overflow-x-auto pb-4 scroll-smooth scrollbar-hide snap-x snap-mandatory"
      style="scrollbar-width: none; -ms-overflow-style: none;">
      
      @for (book of books(); track book.id) {
        <div class="book-card flex-shrink-0 w-[160px] md:w-[180px] snap-start cursor-pointer transition-transform hover:-translate-y-1" (click)="onBookClick(book)">
          <div class="aspect-[2/3] rounded-lg overflow-hidden shadow-md mb-3 bg-gray-200 relative">
            <img 
              [src]="book.coverUrl || 'assets/placeholder-book.png'" 
              [alt]="book.title"
              class="w-full h-full object-cover"
              loading="lazy"
              decoding="async"
              (error)="$event.target.src='https://via.placeholder.com/150x225?text=No+Cover'">
            
            @if (book.stock === 0) {
              <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
                <span class="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">Agotado</span>
              </div>
            }
          </div>
          
        </div>
      }

      @if (books().length === 0) {
        @for (item of [1,2,3,4,5]; track item) {
          <div class="flex-shrink-0 w-[160px] md:w-[180px] animate-pulse">
            <div class="aspect-[2/3] bg-gray-200 rounded-lg mb-3"></div>
            <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-1/2"></div>
          </div>
        }
      }

    </div>

    <button 
      (click)="next()" 
      class="absolute right-0 top-1/2 -translate-y-1/2 -mr-4 z-10 w-10 h-10 rounded-full bg-white shadow-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 hover:bg-gray-50 focus:outline-none"
      style="color: #45332D;"
      aria-label="Siguiente">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  </div>
</div>
