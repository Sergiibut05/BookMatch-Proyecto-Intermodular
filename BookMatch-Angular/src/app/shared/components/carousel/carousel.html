<div class="carousel-section">

  <!-- Cabecera de sección -->
  <div class="carousel-header">
    <h2 class="carousel-section-title">{{ categoryTitle }}</h2>
    @if (isNewArrivals || categoryId || categoryUrl) {
      <button (click)="onSeeMore()" class="see-more-btn" aria-label="Ver más">
        {{ 'BOOK_DETAILS.SEE_MORE' | translate }}
        <span class="material-symbols-outlined see-more-arrow">arrow_forward</span>
      </button>
    }
  </div>

  <!-- Pista del carrusel -->
  <div class="carousel-track-wrapper">

    <button
      (click)="prev()"
      class="carousel-nav carousel-nav--prev"
      aria-label="Anterior">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <div #carousel class="carousel-track">

      @for (book of books(); track book.id) {
        <div class="book-card" (click)="onBookClick(book)">

          <!-- Portada con efecto skeuomórfico de lomo -->
          <div class="book-cover">
            <img
              [src]="book.coverUrl || 'assets/placeholder-book.png'"
              [alt]="book.title"
              class="book-cover__img"
              loading="lazy"
              decoding="async"
              (error)="$event.target.src='assets/placeholder-book.png'">

            <!-- Overlay de lomo estilo libro Apple -->
            <div class="book-cover__spine" aria-hidden="true"></div>

            @if (book.stock === 0) {
              <div class="book-cover__badge-sold-out">
                <span>Agotado</span>
              </div>
            }
          </div>

          <!-- Metadatos del libro -->
          <div class="book-meta">
            <p class="book-meta__title">{{ book.title }}</p>
            <p class="book-meta__author">{{ book.author }}</p>
          </div>

        </div>
      }

      <!-- Skeletons mientras carga -->
      @if (books().length === 0) {
        @for (item of [1,2,3,4,5,6,7,8]; track item) {
          <div class="book-card book-card--skeleton">
            <div class="book-cover book-cover--skeleton"></div>
            <div class="book-meta book-meta--skeleton">
              <div class="skeleton-line skeleton-line--title"></div>
              <div class="skeleton-line skeleton-line--author"></div>
            </div>
          </div>
        }
      }

    </div>

    <button
      (click)="next()"
      class="carousel-nav carousel-nav--next"
      aria-label="Siguiente">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

  </div>
</div>
