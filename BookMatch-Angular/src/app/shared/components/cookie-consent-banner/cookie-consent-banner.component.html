@if (consent.shouldShowBanner()) {
  <div
    class="cookie-banner"
    role="dialog"
    aria-live="polite"
    [attr.aria-label]="'COOKIE_CONSENT.ARIA_LABEL' | translate"
  >
    <div class="cookie-banner__inner">
      <p class="cookie-banner__text">
        {{ 'COOKIE_CONSENT.MESSAGE' | translate }}
        <a routerLink="/cookies-policy" class="cookie-banner__link">
          {{ 'COOKIE_CONSENT.POLICY' | translate }}
        </a>
      </p>
      <div class="cookie-banner__actions">
        <button type="button" class="cookie-banner__btn cookie-banner__btn--ghost" (click)="reject()">
          {{ 'COOKIE_CONSENT.REJECT' | translate }}
        </button>
        <button type="button" class="cookie-banner__btn cookie-banner__btn--primary" (click)="accept()">
          {{ 'COOKIE_CONSENT.ACCEPT' | translate }}
        </button>
      </div>
    </div>
  </div>
}
