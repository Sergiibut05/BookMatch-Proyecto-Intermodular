<div class="book-carousel-3d-container">
  <!-- Gradient overlays: top + bottom fade. Crean transicion suave entre la
       seccion anterior (cream) y la siguiente (cream del home), evitando
       el corte abrupto que tenia la version anterior. -->
  <span class="bc3d-fade bc3d-fade--top" aria-hidden="true"></span>
  <span class="bc3d-fade bc3d-fade--bottom" aria-hidden="true"></span>

  <canvas #canvas class="webgl"></canvas>

  <!-- Eyebrow + Title -->
  <div class="bc3d-header" aria-hidden="true">
    <span class="bc3d-eyebrow">{{ 'HOME.CAROUSEL_3D.EYEBROW' | translate }}</span>
    <h2 class="bc3d-title">{{ title }}</h2>
  </div>

  <!-- Centered book info -->
  <div class="bc3d-book-info" [class.is-visible]="centerBookIndex() !== null">
    <h3 class="bc3d-book-info__title">{{ currentBook()?.title }}</h3>
    <p class="bc3d-book-info__author">{{ currentBook()?.author }}</p>
  </div>

  <!-- Discover CTA -->
  <button
    *ngIf="currentBook()"
    (click)="onDiscoverClick()"
    class="bc3d-discover-btn"
    [class.is-visible]="centerBookIndex() !== null">
    <span>{{ 'HOME.CAROUSEL_3D.VIEW_BOOK' | translate }}</span>
    <span class="material-symbols-outlined bc3d-discover-btn__arrow">arrow_forward</span>
  </button>

  <!-- Premium nav buttons — visibles siempre (no solo hover) -->
  <button
    (click)="onPrevClick()"
    class="bc3d-nav bc3d-nav--left"
    type="button"
    aria-label="Libro anterior">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>

  <button
    (click)="onNextClick()"
    class="bc3d-nav bc3d-nav--right"
    type="button"
    aria-label="Libro siguiente">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>
</div>
