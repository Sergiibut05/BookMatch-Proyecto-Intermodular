<app-header></app-header>

<div class="min-h-screen" style="background-color: #FCF5E2;">
  <div class="max-w-4xl mx-auto px-4 py-12">
    
    <!-- Loading state -->
    @if (isLoading()) {
      <div class="flex items-center justify-center min-h-[60vh]">
        <div class="text-center">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-t-transparent" style="border-color: #E0A15E;"></div>
          <p class="mt-4 text-lg" style="color: #45332D;">Cargando perfil...</p>
        </div>
      </div>
    }

    <!-- Error state -->
    @if (!isLoading() && error()) {
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <div class="flex items-center gap-3 text-red-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <p>{{ error() }}</p>
        </div>
      </div>
    }

    <!-- Profile content -->
    @if (!isLoading() && profile()) {
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="p-8 md:p-12">
          
          <!-- Profile photo section -->
          <div class="flex flex-col items-center mb-8">
            <div class="relative">
              <!-- Avatar -->
              <div 
                class="w-32 h-32 rounded-full overflow-hidden border-4 flex items-center justify-center"
                style="border-color: #E0A15E; background-color: #E9E1D1;">
                @if (hasPhoto()) {
                  <img 
                    [src]="getAvatarUrl()!" 
                    [alt]="profile()!.fullName || 'Avatar'"
                    class="w-full h-full object-cover">
                } @else {
                  <!-- Default icon -->
                  <svg class="w-16 h-16" style="color: #45332D;" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                  </svg>
                }
              </div>

              <!-- Upload button overlay -->
              <button
                [disabled]="isUploading()"
                (click)="changePhoto()"
                class="absolute bottom-0 right-0 w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                style="background-color: #E0A15E; color: #FCF5E2;"
                onmouseover="if(!this.disabled) this.style.backgroundColor='#B88B65'"
                onmouseout="if(!this.disabled) this.style.backgroundColor='#E0A15E'"
                title="Cambiar foto de perfil">
                @if (isUploading()) {
                  <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-t-transparent border-white"></div>
                } @else {
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                }
              </button>
            </div>

            <!-- User name -->
            <h1 class="text-2xl md:text-3xl font-bold mt-4" style="color: #45332D;">
              {{ profile()!.fullName || 'Usuario' }}
            </h1>
            <p class="text-base mt-1" style="color: #4E6A6A; opacity: 0.8;">
              {{ profile()!.email }}
            </p>
          </div>

          <!-- Profile info section -->
          <div class="border-t pt-6" style="border-color: #E9E1D1;">
            @if (profile()) {
              <app-profile-edit 
                [profile]="profile()!" 
                (profileUpdated)="onProfileUpdated($event)">
              </app-profile-edit>
            }
          </div>

        </div>
      </div>

      <!-- Purchase History Section -->
      <div class="mt-8">
        <app-purchase-history></app-purchase-history>
      </div>
    }

  </div>
</div>
