<app-header></app-header>

<div class="chat-page-container" style="background-color: #FCF5E2; min-height: 100vh;">
  <div class="chat-page-content">
    <!-- Header de la página -->
    <div class="chat-page-header">
      <div class="flex items-center gap-3">
        <div class="chat-page-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </div>
        <div>
          <h1 class="chat-page-title">Asistente de Recomendaciones</h1>
          <p class="chat-page-subtitle">Pregúntame sobre libros y te ayudaré a encontrar el perfecto para ti</p>
        </div>
      </div>
    </div>

    <!-- Mensajes -->
    <div class="chat-page-messages" #messagesContainer>
      @for (message of messages(); track message.id) {
        <div class="chat-page-message-wrapper" [class.user-message]="message.isUser" [class.ai-message]="!message.isUser">
          <div class="chat-page-message-content" [innerHTML]="message.isUser ? message.content : message.content"></div>
          <span class="chat-page-message-time">{{ message.timestamp | date:'short' }}</span>
        </div>
      }
      @if (isLoading()) {
        <div class="chat-page-message-wrapper ai-message">
          <div class="chat-page-message-content">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Input del chat -->
    <div class="chat-page-input-container">
      <div class="chat-page-input-wrapper">
        <textarea
          [(ngModel)]="currentMessage"
          (keydown)="onEnterKey($event)"
          placeholder="Escribe tu mensaje..."
          class="chat-page-input"
          rows="2"
          [disabled]="isLoading()"></textarea>
        <button
          (click)="sendMessage()"
          [disabled]="!currentMessage().trim() || isLoading()"
          class="chat-page-send-button"
          aria-label="Enviar mensaje">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
