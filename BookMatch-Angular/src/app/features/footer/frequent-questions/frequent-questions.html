<app-header></app-header>

<div class="faq-container">
  <div class="max-w-4xl mx-auto px-4 py-8 md:py-12">
    <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center" style="color: #45332D;">
      {{ 'FAQ.TITLE' | translate }}
    </h1>

    <div class="faq-content space-y-4">
      @for (faq of faqs; track faq.id) {
        <div class="faq-item bg-white rounded-lg shadow-sm overflow-hidden" style="border: 1px solid #E9E1D1;">
          <button
            (click)="toggleFaq(faq.id)"
            class="w-full px-6 py-4 text-left flex items-center justify-between transition-colors"
            [style.background-color]="faq.isOpen ? '#FCF5E2' : 'white'"
            style="color: #45332D;">
            <span class="font-semibold text-lg pr-4">{{ faq.question | translate }}</span>
            <svg 
              class="w-5 h-5 flex-shrink-0 transition-transform"
              [class.rotate-180]="faq.isOpen"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          @if (faq.isOpen) {
            <div class="px-6 pb-4" style="color: #45332D;">
              <p class="leading-relaxed">{{ faq.answer | translate }}</p>
            </div>
          }
        </div>
      }
    </div>

    <!-- Contact Section -->
    <div class="mt-12 text-center">
      <p class="mb-4" style="color: #45332D;">
        {{ 'FAQ.STILL_QUESTIONS' | translate }}
      </p>
      <a 
        href="mailto:bookmatch3@gmail.com" 
        class="inline-block px-6 py-3 rounded-lg transition-colors"
        style="background-color: #E0A15E; color: #FCF5E2;"
        onmouseover="this.style.backgroundColor='#B88B65'"
        onmouseout="this.style.backgroundColor='#E0A15E'">
        {{ 'FAQ.CONTACT_US' | translate }}
      </a>
    </div>
  </div>
</div>

<app-footer></app-footer>
