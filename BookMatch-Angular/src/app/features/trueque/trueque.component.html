<app-header />

<main class="min-h-[calc(100vh-64px)] bg-[#FCF5E2]">
  <section class="mx-auto w-full max-w-6xl px-4 sm:px-6 py-5 sm:py-7">
    <div class="pl-fade-in">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-xl sm:text-2xl font-bold text-[#45332D] tracking-tight">
          {{ 'TRUEQUE.TITLE' | translate }}
        </h2>
      </div>

      <div class="mt-4 rounded-2xl bg-white/70 backdrop-blur border border-[#E9E1D1] shadow-sm overflow-hidden">
        <div class="grid grid-cols-3 text-center">
          <button
            type="button"
            class="py-3 text-sm sm:text-base font-semibold text-[#45332D] press-target"
            [class.bg-white]="activeTab() === 'news'"
            [class.border-b-2]="activeTab() === 'news'"
            [class.border-[#E0A15E]]="activeTab() === 'news'"
            (click)="setTab('news')">
            {{ 'TRUEQUE.TAB_NEWS' | translate }}
          </button>

          <button
            type="button"
            class="py-3 text-sm sm:text-base font-semibold text-[#45332D] press-target"
            [class.bg-white]="activeTab() === 'popular'"
            [class.border-b-2]="activeTab() === 'popular'"
            [class.border-[#E0A15E]]="activeTab() === 'popular'"
            (click)="setTab('popular')">
            {{ 'TRUEQUE.TAB_NEAR' | translate }}
          </button>

          <button
            type="button"
            class="py-3 text-sm sm:text-base font-semibold text-[#45332D] press-target"
            [class.bg-white]="activeTab() === 'mine'"
            [class.border-b-2]="activeTab() === 'mine'"
            [class.border-[#E0A15E]]="activeTab() === 'mine'"
            (click)="setTab('mine')">
            {{ 'TRUEQUE.TAB_MINE' | translate }}
          </button>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-base sm:text-lg font-bold text-[#45332D]">
          {{ 'TRUEQUE.AVAILABLE_TITLE' | translate }}
        </h3>

        @if (cards().length === 0) {
          <div class="mt-4 rounded-2xl border border-[#E9E1D1] bg-white/70 p-5 text-[#45332D]">
            <p class="font-bold">{{ 'TRUEQUE.EMPTY_TITLE' | translate }}</p>
            <p class="mt-1 text-sm opacity-80">{{ 'TRUEQUE.EMPTY_BODY' | translate }}</p>
          </div>
        } @else {
          <div class="mt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 pl-stagger-auto">
            @for (card of cards(); track card.id) {
              <article class="rounded-2xl border border-[#E9E1D1] bg-white/80 shadow-sm overflow-hidden pl-card-hover">
                <div class="p-3">
                  <div class="rounded-xl overflow-hidden border border-[#E9E1D1] bg-[#FFFDF7] aspect-[3/4]">
                    <img
                      [src]="card.coverUrl"
                      [alt]="card.title"
                      class="h-full w-full object-cover"
                      loading="lazy"
                      decoding="async" />
                  </div>

                  <div class="mt-3">
                    <p class="text-sm font-bold text-[#45332D] leading-snug line-clamp-2">
                      {{ card.title }}
                    </p>
                    <p class="mt-1 text-xs text-[#6b4d39] line-clamp-1">
                      {{ card.author }}
                    </p>
                  </div>

                  <div class="mt-3">
                    <button type="button" class="w-full pl-btn-primary rounded-xl py-2 text-sm font-bold">
                      {{ 'TRUEQUE.CTA_SWAP' | translate }}
                    </button>
                  </div>
                </div>
              </article>
            }
          </div>
        }
      </div>
    </div>
  </section>
</main>

<app-footer />
